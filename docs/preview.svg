<svg viewBox="0 0 680 380" width="680" height="380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
<title>Cardify preview</title>
<desc>Mockup of Cardify cards: a title card, a list with status badges, a table and a code card.</desc>
<rect width="680" height="380" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="5" fill="#f85149"/><circle cx="38" cy="18" r="5" fill="#d29922"/><circle cx="56" cy="18" r="5" fill="#3fb950"/>
<rect x="20" y="36" width="640" height="38" rx="6" fill="none" stroke="#22d3ee"/>
<text x="36" y="60" fill="#22d3ee" font-weight="bold">Deploy report</text>
<rect x="20" y="86" width="640" height="112" rx="6" fill="none" stroke="#3fb950"/>
<text x="36" y="110" fill="#e6edf3"><tspan fill="#3fb950">● </tspan>Unit tests</text>
<rect x="190" y="97" width="61" height="18" rx="3" fill="#3fb950"/><text x="197" y="110" fill="#0b0b0b" font-weight="bold">passed</text>
<text x="36" y="134" fill="#e6edf3"><tspan fill="#3fb950">● </tspan>Type check</text>

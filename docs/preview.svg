<text x="36" y="158" fill="#e6edf3"><tspan fill="#3fb950">● </tspan>Deploy</text>
<rect x="190" y="145" width="61" height="18" rx="3" fill="#f85149"/><text x="197" y="158" fill="#0b0b0b" font-weight="bold">failed</text>
<text x="36" y="182" fill="#e6edf3"><tspan fill="#3fb950">● </tspan>Cache warmup</text>
<rect x="190" y="169" width="69" height="18" rx="3" fill="#d29922"/><text x="197" y="182" fill="#0b0b0b" font-weight="bold">pending</text>
<rect x="20" y="210" width="640" height="88" rx="6" fill="none" stroke="#d946ef"/>
<text x="36" y="234" fill="#d946ef" font-weight="bold">Step</text><text x="200" y="234" fill="#d946ef" font-weight="bold">Time</text><text x="380" y="234" fill="#d946ef" font-weight="bold">Status</text>
<text x="36" y="258" fill="#e6edf3">Build</text><text x="200" y="258" fill="#e6edf3">42s</text>
<rect x="380" y="245" width="45" height="18" rx="3" fill="#3fb950"/><text x="387" y="258" fill="#0b0b0b" font-weight="bold">done</text>
